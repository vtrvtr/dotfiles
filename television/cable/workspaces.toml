[metadata]
name = "workspaces"
description = "Navigate Jujutsu workspaces and Git worktrees"
requirements = ["jj", "git"]

[source]
command = "${XDG_CONFIG_HOME:-$HOME/.config}/television/cable/workspaces.sh"
display = "{split:\t:1}  {split:\t:2}  {split:\t:0}"
output = "{split:\t:0}"
no_sort = true
frecency = false

[preview]
command = "jj --ignore-working-copy -R '{split:\t:0}' log --no-graph -n 10 --color=always && echo && jj --ignore-working-copy -R '{split:\t:0}' status"

