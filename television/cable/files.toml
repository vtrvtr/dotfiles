[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
command = ["fd -t f -t d", "fd -t f -t d -H"]
# output = "cd [[ -d '{}' ]] && '{}' || $(dirname '{}')"
# output = "cd $(dirname '{}')"
# output = "~/.config/television/cable/chrdir.sh {}"

[preview]
command = "[[ -d '{}' ]] && ls -la --color=always '{}' || bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
enter = "actions:cd"
shift-enter = "actions:edit"

[actions.cd]
description = "Enter directory"
command = "if [[ -d '{}' ]]; then cd '{}'; else cd $(dirname '{}'); fi && $SHELL"
mode = "execute"

[actions.edit]
description = "Open file in nvim"
command = "NVIM_APPNAME=nvim_windows nvim '{}'"
mode = "execute"
